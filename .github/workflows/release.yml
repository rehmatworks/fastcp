name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  check:
    name: Checks
    uses: ./.github/workflows/ci.yml

  version:
    name: Tag matches VERSION
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: |
          want="v$(cat VERSION)"
          if [ "$GITHUB_REF_NAME" != "$want" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match VERSION ($want). Run 'make bump V=x.y.z'."
            exit 1
          fi
          grep -q "^FASTCP_VERSION_DEFAULT=\"$want\"$" scripts/install.sh || {
            echo "::error::scripts/install.sh does not default to $want."
            exit 1
          }

  build:
    name: Build ${{ matrix.arch }}
    needs: [check, version]
    runs-on: ${{ matrix.runner }}
    # Built on the oldest supported Ubuntu so the binaries run on every
    # supported release (CGO links against glibc).
    container: ubuntu:22.04
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Install dependencies
        run: apt-get update -qq && apt-get install -y -qq ca-certificates gcc libc6-dev libpam0g-dev >/dev/null
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.x'
          check-latest: true
          cache: false
      - name: Build
        env:
          CGO_ENABLED: '1'
          # glibc before 2.36 only declares RTLD_NEXT (used by the PAM
          # bindings) when _GNU_SOURCE is defined.
          CGO_CFLAGS: '-O2 -g -D_GNU_SOURCE'
        run: |
          pkg=github.com/rehmatworks/fastcp/internal/version
          ldflags="-s -w -X $pkg.Version=$(cat VERSION) -X $pkg.BuildTime=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          go build -trimpath -ldflags "$ldflags" -o fastcp-linux-${{ matrix.arch }} ./cmd/fastcp
          go build -trimpath -ldflags "$ldflags" -o fastcp-agent-linux-${{ matrix.arch }} ./cmd/fastcp-agent
          ./fastcp-linux-${{ matrix.arch }} --version
      - uses: actions/upload-artifact@v7
        with:
          name: binaries-${{ matrix.arch }}
          path: |
            fastcp-linux-${{ matrix.arch }}
            fastcp-agent-linux-${{ matrix.arch }}
          if-no-files-found: error

  release:
    name: Publish
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.x'
          check-latest: true
      - uses: actions/download-artifact@v8
        with:
          pattern: binaries-*
          merge-multiple: true
      - name: Checksums and signature
        env:
          FASTCP_SIGNING_KEY: ${{ secrets.FASTCP_SIGNING_KEY }}
        run: |
          if [ -z "$FASTCP_SIGNING_KEY" ]; then
            echo "::error::The FASTCP_SIGNING_KEY secret is not set. See README.md, 'Releasing'."
            exit 1
          fi
          sha256sum fastcp-linux-amd64 fastcp-linux-arm64 fastcp-agent-linux-amd64 fastcp-agent-linux-arm64 > SHA256SUMS
          go run ./tools/releasekey sign SHA256SUMS
          go run ./tools/releasekey verify SHA256SUMS
          cp scripts/install.sh install.sh
          cp scripts/uninstall.sh uninstall.sh
          cat SHA256SUMS
      - uses: softprops/action-gh-release@v3
        with:
          name: FastCP ${{ github.ref_name }}
          generate_release_notes: true
          body: |
            ### Install

            ```bash
            curl -fsSL https://get.fastcp.org | sudo bash
            ```

            Requires Ubuntu 22.04 or newer, or Debian 12 or newer, on a clean server.

            Existing servers update from **Settings → Updates**. Releases are signed: `SHA256SUMS.sig` is an Ed25519 signature of `SHA256SUMS`, verified by the installer and the updater.
          files: |
            fastcp-linux-amd64
            fastcp-linux-arm64
            fastcp-agent-linux-amd64
            fastcp-agent-linux-arm64
            SHA256SUMS
            SHA256SUMS.sig
            install.sh
            uninstall.sh
          fail_on_unmatched_files: true
