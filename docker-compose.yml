# FastCP in Docker, for trying the panel and testing the installer.
# Usage: docker compose up --build, then open https://localhost:2050
# The administrator password is printed in the logs on first start.

services:
  fastcp:
    build: .
    container_name: fastcp
    hostname: fastcp
    init: true
    ports:
      - "2050:2050"
      - "80:80"
      - "443:443"
    volumes:
      - fastcp-data:/opt/fastcp/data
      - mysql-data:/var/lib/mysql
      - homes:/home

volumes:
  fastcp-data:
  mysql-data:
  homes:
